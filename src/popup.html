<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Relintio Inspector</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --panel: #111113;
            --border: rgba(255, 255, 255, .08);
            --fg: #f4f4f5;
            --fg-dim: #9b9ba3;
            --fg-faint: #6b6b73;
            --accent: #edb81e;
            --critical: #f0554d;
            --ok: #4ade80;
        }

        * { box-sizing: border-box; }

        body {
            width: 400px;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
        }

        header img { width: 20px; height: 20px; }

        header .name {
            font-weight: 700;
            font-size: 12px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        header .host {
            margin-left: auto;
            font-size: 11px;
            color: var(--fg-faint);
            max-width: 190px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .summary { padding: 16px; border-bottom: 1px solid var(--border); }

        .summary .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .dot { width: 7px; height: 7px; border-radius: 50%; }

        .status-critical { color: var(--critical); }
        .status-critical .dot { background: var(--critical); }
        .status-ok { color: var(--ok); }
        .status-ok .dot { background: var(--ok); }
        .status-unknown { color: var(--fg-faint); }
        .status-unknown .dot { background: var(--fg-faint); }

        .summary h1 { font-size: 15px; font-weight: 700; margin: 0 0 6px; line-height: 1.35; }
        .summary p { margin: 0; font-size: 12px; color: var(--fg-dim); }

        section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        section:last-of-type { border-bottom: 0; }

        section h2 {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--fg-faint);
            margin: 0 0 10px;
        }

        .row {
            display: flex;
            gap: 9px;
            padding: 8px 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .row:last-child { margin-bottom: 0; }
        .row.critical { border-color: rgba(240, 85, 77, .45); }

        .row .body { min-width: 0; flex: 1; }

        .row code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            color: var(--accent);
            word-break: break-all;
        }

        .row .where {
            display: block;
            font-size: 11px;
            color: var(--fg-faint);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .signal { font-size: 12px; color: var(--fg-dim); margin-bottom: 5px; }
        .signal:last-child { margin-bottom: 0; }
        .signal strong { color: var(--fg); font-weight: 600; }

        .note { font-size: 11px; color: var(--fg-faint); line-height: 1.5; }

        footer { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }

        footer a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        footer a:hover { text-decoration: underline; }

        footer .privacy { margin-left: auto; font-size: 10px; color: var(--fg-faint); }

        .empty { padding: 30px 16px; text-align: center; color: var(--fg-faint); font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <img src="../icons/icon32.png" alt="">
        <span class="name">Relintio Inspector</span>
        <span class="host" id="host"></span>
    </header>

    <div id="output">
        <div class="empty">Reading this page…</div>
    </div>

    <footer>
        <a href="https://relintio.com/docs" target="_blank" rel="noopener">Documentation</a>
        <span class="privacy">Nothing leaves your browser.</span>
    </footer>

    <script type="module" src="popup.js"></script>
</body>
</html>
